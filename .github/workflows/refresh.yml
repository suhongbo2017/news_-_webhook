name: refresh

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      bootstrap:
        description: 立即推送当前热点（跳过首次静默，用于验证 webhook）
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  snapshot:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 抓取并聚类
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_MIN_HEAT: ${{ vars.WEBHOOK_MIN_HEAT }}
          WEBHOOK_MAX_ITEMS: ${{ vars.WEBHOOK_MAX_ITEMS }}
          PUSH_TZ: ${{ vars.PUSH_TZ }}
          PUSH_START_HOUR: ${{ vars.PUSH_START_HOUR }}
          PUSH_END_HOUR: ${{ vars.PUSH_END_HOUR }}
          PUSH_MIN_GAP: ${{ vars.PUSH_MIN_GAP }}
          WEBHOOK_BOOTSTRAP: ${{ inputs.bootstrap && '1' || '' }}
        run: node scripts/snapshot.mjs
      - name: 提交快照
        run: |
          git config user.name 'radar-bot'
          git config user.email 'radar-bot@users.noreply.github.com'
          git add public/data/latest.json
          [ -f state/notified.json ] && git add state/notified.json || true
          if git diff --quiet --cached; then
            echo '快照无变化，跳过提交'
          else
            git commit -m "chore(data): snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

  build:
    needs: snapshot
    if: always() && (needs.snapshot.result == 'success' || github.event_name == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
